name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  # Unconditional quality-gate floor: every PR gets at least this signal, regardless of what the
  # `affected` job's --only-changed selection below finds — guards against blind spots where a
  # change (e.g. to playwright.config.ts) doesn't register as "affecting" any spec file under
  # module-graph-based dependency tracking, but should still get some real coverage.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test tests/smoke.spec.ts --project=${{ matrix.browser }}
        env:
          TEST_ENV: hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

  # Test-impact-based selective execution — NON-BLOCKING advisory job, not a required check.
  # Runs whatever spec files Playwright's --only-changed determines are affected by this PR's
  # diff. PROVEN RELIABLE for: a PR touching only docs/infra/CI-config (correctly selects zero
  # tests, a clean pass via --pass-with-no-tests, not a failure); a spec file changed directly;
  # a file a spec imports directly (e.g. config/credentials.ts); the shared fixture file itself
  # (correctly marks every spec as affected). PROVEN UNRELIABLE for: page object files
  # (pages/*.ts) — verified via a real PR (both locally on Windows and on this Linux runner) that
  # editing a page object does NOT surface its real dependent specs, instead pointing at an
  # unrelated one. Root cause not identified (suspected: Playwright's dependency collector and
  # this project's `import * as X from '@axe-core/playwright'` namespace-import pattern in the
  # accessibility spec, but unconfirmed). Since page objects are the core unit of change in this
  # Page-Object-Model framework, do not treat this job's selection as complete for anything
  # beyond docs/infra-only changes — `smoke` below is the only job every PR can actually be
  # trusted against. Deliberately not using --fail-on-flaky-tests here or in `smoke` — it would
  # fight the retries:2 accommodation already in place for the shared hosted instance's transient
  # slowness, turning expected retries into hard failures.
  affected:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          # --only-changed needs real git history to diff against; the default shallow checkout
          # doesn't have origin/main's commits available and fails outright.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: List affected tests
        run: pnpm exec playwright test --only-changed=origin/main --pass-with-no-tests --project=${{ matrix.browser }} --list
      - run: pnpm exec playwright test --only-changed=origin/main --pass-with-no-tests --project=${{ matrix.browser }}
        env:
          TEST_ENV: hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-affected-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
