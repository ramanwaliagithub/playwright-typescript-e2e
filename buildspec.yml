version: 0.2

env:
  variables:
    TEST_ENV: hosted

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      # No explicit `corepack prepare pnpm@<version>` — corepack reads package.json's
      # packageManager field and resolves the right version on its own at first use (confirmed:
      # even with a stale explicit prepare pinning an old version, the pnpm install below still
      # correctly downloaded and used whatever packageManager specified). Keeps this file from
      # needing an edit every time pnpm gets bumped.
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm exec playwright install --with-deps chromium firefox webkit

  build:
    commands:
      - pnpm run test:hosted

  post_build:
    commands:
      - REPORT_PREFIX="reports/$(date -u +%Y-%m-%dT%H-%M-%SZ)-${CODEBUILD_BUILD_NUMBER:-manual}"
      - aws s3 cp playwright-report "s3://${REPORTS_BUCKET}/${REPORT_PREFIX}/playwright-report" --recursive
      - pnpm run report:allure
      - aws s3 cp allure-report "s3://${REPORTS_BUCKET}/${REPORT_PREFIX}/allure-report" --recursive
